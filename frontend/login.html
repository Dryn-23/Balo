<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Arimo:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <div class="bg-glow"></div>
  <div class="bg-grid"></div>

  <main class="panel">
    <div class="panel__slash"></div>

    <div class="panel__brand">
      <span class="panel__brand-mark">//</span>
      <span class="panel__brand-name">BALORANT</span>
    </div>

    <div class="panel__body" id="panelBody">

      <section class="view" id="loginView">
        <p class="view__eyebrow">Agent Access</p>
        <h1 class="view__title">Sign In</h1>

        <form id="loginForm" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" autocomplete="email" required>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="password-wrap">
              <input type="password" id="password" autocomplete="current-password" required>
              <button type="button" class="eye-btn" data-target="password" aria-label="Show password">
                <svg class="eye-open" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 5c-7 0-10 7-10 7s3 7 10 7 10-7 10-7-3-7-10-7zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-2a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/></svg>
                <svg class="eye-closed hidden" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M3.28 2.22 2.22 3.28l3.02 3.02C3.1 7.98 1.5 10 1.5 10s3 7 10.5 7c1.9 0 3.5-.44 4.83-1.1l3.17 3.17 1.06-1.06L3.28 2.22zM12 15.5a5.5 5.5 0 0 1-5.5-5.5c0-.9.23-1.74.63-2.48l1.5 1.5a3.5 3.5 0 0 0 4.85 4.85l1.5 1.5c-.74.4-1.58.63-2.48.63zM12 4.5c1.9 0 3.5.44 4.83 1.1l-1.5 1.5A5.48 5.48 0 0 0 12 6.5a5.44 5.44 0 0 0-1.6.24l-1.6-1.6C9.5 4.7 10.7 4.5 12 4.5z"/></svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn" id="loginBtn">
            <span class="btn-text">Login</span>
            <span class="spinner hidden"></span>
          </button>

          <p class="msg" id="message"></p>
        </form>

        <p class="switch">No account yet? <a href="#" id="showRegister">Create one</a></p>
      </section>

      <section class="view hidden" id="registerView">
        <p class="view__eyebrow">New Recruit</p>
        <h1 class="view__title">Create Account</h1>

        <form id="registerForm" novalidate>
          <div class="field">
            <label for="name">Name</label>
            <input type="text" id="name" autocomplete="name">
          </div>

          <div class="field">
            <label for="regEmail">Email</label>
            <input type="email" id="regEmail" autocomplete="email">
          </div>

          <div class="field">
            <label for="regPassword">Password</label>
            <div class="password-wrap">
              <input type="password" id="regPassword" autocomplete="new-password">
              <button type="button" class="eye-btn" data-target="regPassword" aria-label="Show password">
                <svg class="eye-open" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 5c-7 0-10 7-10 7s3 7 10 7 10-7 10-7-3-7-10-7zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-2a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/></svg>
                <svg class="eye-closed hidden" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M3.28 2.22 2.22 3.28l3.02 3.02C3.1 7.98 1.5 10 1.5 10s3 7 10.5 7c1.9 0 3.5-.44 4.83-1.1l3.17 3.17 1.06-1.06L3.28 2.22zM12 15.5a5.5 5.5 0 0 1-5.5-5.5c0-.9.23-1.74.63-2.48l1.5 1.5a3.5 3.5 0 0 0 4.85 4.85l1.5 1.5c-.74.4-1.58.63-2.48.63zM12 4.5c1.9 0 3.5.44 4.83 1.1l-1.5 1.5A5.48 5.48 0 0 0 12 6.5a5.44 5.44 0 0 0-1.6.24l-1.6-1.6C9.5 4.7 10.7 4.5 12 4.5z"/></svg>
              </button>
            </div>
          </div>

          <div class="field">
            <label for="regConfirmPassword">Confirm Password</label>
            <div class="password-wrap">
              <input type="password" id="regConfirmPassword" autocomplete="new-password">
              <button type="button" class="eye-btn" data-target="regConfirmPassword" aria-label="Show password">
                <svg class="eye-open" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 5c-7 0-10 7-10 7s3 7 10 7 10-7 10-7-3-7-10-7zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-2a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/></svg>
                <svg class="eye-closed hidden" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M3.28 2.22 2.22 3.28l3.02 3.02C3.1 7.98 1.5 10 1.5 10s3 7 10.5 7c1.9 0 3.5-.44 4.83-1.1l3.17 3.17 1.06-1.06L3.28 2.22zM12 15.5a5.5 5.5 0 0 1-5.5-5.5c0-.9.23-1.74.63-2.48l1.5 1.5a3.5 3.5 0 0 0 4.85 4.85l1.5 1.5c-.74.4-1.58.63-2.48.63zM12 4.5c1.9 0 3.5.44 4.83 1.1l-1.5 1.5A5.48 5.48 0 0 0 12 6.5a5.44 5.44 0 0 0-1.6.24l-1.6-1.6C9.5 4.7 10.7 4.5 12 4.5z"/></svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn" id="registerBtn">
            <span class="btn-text">Register</span>
            <span class="spinner hidden"></span>
          </button>

          <p class="msg" id="registerMessage"></p>
        </form>

        <p class="switch">Already an agent? <a href="#" id="showLogin">Sign in</a></p>
      </section>

    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
